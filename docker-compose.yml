services:
  postgres:
    image: postgres:16
    container_name: quran_academy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quran_academy
      POSTGRES_USER: quran
      POSTGRES_PASSWORD: quran
    ports:
      - "5432:5432"
    volumes:
      - qa_pg_data:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  qa_pg_data:
